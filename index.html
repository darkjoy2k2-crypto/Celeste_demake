<div class="controls-box" style="margin-bottom: 10px;">
    <h3>Select Project</h3>
    <select id="project-selector" style="width: 100%; padding: 10px; background: #0d1117; color: white; border: 1px solid #30363d;">
        <option value="Celeste_demake/out/rom.bin" data-title="Celeste Demake">Celeste Demake</option>
        <option value="tetris-vibe/out/rom.bin" data-title="Tetris Vibe SGDK">Tetris Vibe SGDK</option>
        </select>
</div>

<script>
    const selector = document.getElementById('project-selector');
    const titleHeader = document.querySelector('h1');

    function loadGame(romUrl, title) {
        // Clear existing emulator instance if necessary
        document.getElementById('game').innerHTML = '';
        titleHeader.innerText = title;

        EJS_player = "#game";
        EJS_core = "segaMD";
        EJS_gameUrl = romUrl;
        EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        
        // Reload loader script to trigger new game
        const oldScript = document.querySelector('script[src*="loader.js"]');
        if (oldScript) oldScript.remove();
        
        const script = document.createElement('script');
        script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        document.body.appendChild(script);
    }

    selector.addEventListener('change', (e) => {
        const option = e.target.options[e.target.selectedIndex];
        loadGame(e.target.value, option.dataset.title);
    });

    // Initial Load
    loadGame(selector.value, "Celeste Demake");
</script>
