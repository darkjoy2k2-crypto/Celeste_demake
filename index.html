<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sega Genesis Dev Hub | darkjoy2k2</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; 
            line-height: 1.6; color: #c9d1d9; background-color: #0d1117; margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
        }
        
        /* Top Navigation Bar */
        .top-bar {
            width: 100%;
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .top-bar a {
            color: #8b949e;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.2s;
        }
        .top-bar a:hover { color: #58a6ff; }
        .top-bar .active-link { color: #f0f6fc; border-bottom: 2px solid #f78166; }

        .container { max-width: 850px; width: 100%; padding: 20px; }
        h1 { border-bottom: 1px solid #30363d; padding-bottom: 10px; color: #f0f6fc; text-align: center; font-size: 1.8rem; }
        
        #game-container { 
            width: 100%; aspect-ratio: 4 / 3; background: #000; margin: 20px 0;
            border-radius: 12px; overflow: hidden; border: 3px solid #30363d;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        #game { width: 100%; height: 100%; }

        .selector-box {
            background-color: #161b22; border: 2px solid #58a6ff; border-radius: 8px;
            padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 12px rgba(88, 166, 255, 0.1);
        }
        select {
            width: 100%; padding: 14px; background: #0d1117; color: #58a6ff;
            border: 1px solid #30363d; border-radius: 6px; font-size: 1.1rem; cursor: pointer;
            outline: none;
        }

        .controls-box {
            background-color: #161b22; border: 1px solid #30363d; border-radius: 8px;
            padding: 20px; margin-bottom: 25px;
        }
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .control-item { display: flex; align-items: center; font-size: 0.95rem; color: #e6edf3; }
        
        .btn-round {
            display: inline-flex; justify-content: center; align-items: center;
            width: 30px; height: 30px; border-radius: 50%; color: white;
            font-weight: bold; margin-right: 15px; font-size: 0.85rem;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3);
        }
        
        .btn-a { background-color: #ff3e3e; }
        .btn-b { background-color: #3eaf7c; }
        .btn-c { background-color: #3e8eff; }
        .btn-mode { background-color: #6e7681; border-radius: 4px; width: auto; padding: 0 10px; font-size: 0.7rem; }

        .readme-content { border-top: 1px solid #30363d; margin-top: 30px; padding-top: 25px; }
        h3 { color: #58a6ff; margin-top: 0; font-size: 1.3rem; }
        p { color: #8b949e; }
        
        .footer { 
            margin-top: 50px; padding: 20px; border-top: 1px solid #30363d;
            text-align: center; font-size: 0.9rem; color: #8b949e; width: 100%;
        }
        a { color: #58a6ff; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<nav class="top-bar">
    <a href="#" class="active-link">Emulator Hub</a>
    <a id="nav-repo" href="https://github.com/darkjoy2k2-crypto/tetris-sgdk" target="_blank">Repository</a>
    <a id="nav-wiki" href="https://github.com/darkjoy2k2-crypto/tetris-sgdk/wiki" target="_blank">Wiki</a>
</nav>

<div class="container">
    <h1 id="main-title">Tetris Vibe SGDK - See what AI can do for you</h1>

    <div class="selector-box">
        <label for="project-selector" style="display:block; margin-bottom:10px; font-weight:600; font-size:0.85rem; color:#8b949e; text-transform:uppercase;">Select a Project to Play:</label>
        <select id="project-selector">
            <option value="tetris">Tetris Vibe SGDK (Latest Build)</option>
            <option value="celeste">Celeste Demake (v0.x)</option>
        </select>
    </div>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <div class="controls-box">
        <h3>Input Configuration</h3>
        <div id="controls-display" class="controls-grid"></div>
    </div>

    <div id="readme-display" class="readme-content"></div>

    <div class="footer">
        Powered by EmulatorJS | Developed with Gemini AI | <a href="https://github.com/darkjoy2k2-crypto">GitHub Profile</a>
    </div>
</div>

<script>
    const projects = {
        tetris: {
            title: "Tetris Vibe SGDK - See what AI can do for you",
            rom: "https://raw.githubusercontent.com/darkjoy2k2-crypto/tetris-sgdk/main/out/rom.bin",
            repo: "https://github.com/darkjoy2k2-crypto/tetris-sgdk",
            wiki: "https://github.com/darkjoy2k2-crypto/tetris-sgdk/wiki",
            controls: [
                { btn: "A", label: "Rotate Left/Right", class: "btn-a" },
                { btn: "B", label: "Rotate Left/Right", class: "btn-b" },
                { btn: "C", label: "Hold Piece", class: "btn-c" },
                { btn: "UP", label: "Hard Drop", class: "btn-mode" }
            ],
            about: `<h3>About Tetris Vibe</h3><p>A fully functional Tetris clone for 16-bit hardware. Features "Tetromino Rain" parallax and 7-bag RNG.</p>`
        },
        celeste: {
            title: "Celeste Demake (Sega Genesis)",
            rom: "https://raw.githubusercontent.com/darkjoy2k2-crypto/Celeste_demake/main/out/rom.bin",
            repo: "https://github.com/darkjoy2k2-crypto/Celeste_demake",
            wiki: "https://github.com/darkjoy2k2-crypto/Celeste_demake/wiki",
            controls: [
                { btn: "A", label: "Jump", class: "btn-a" },
                { btn: "B", label: "Climb", class: "btn-b" },
                { btn: "C", label: "Dash", class: "btn-c" },
                { btn: "MODE", label: "Fly (Debug)", class: "btn-mode" }
            ],
            about: `<h3>About Celeste Demake</h3><p>A precision platforming demake. Challenge the mountain on retro hardware.</p>`
        }
    };

    const selector = document.getElementById('project-selector');
    const navRepo = document.getElementById('nav-repo');
    const navWiki = document.getElementById('nav-wiki');
    
    function updateUI(projectId) {
        const p = projects[projectId];
        document.getElementById('main-title').innerText = p.title;
        document.getElementById('readme-display').innerHTML = p.about;
        
        // Update Navigation Links
        navRepo.href = p.repo;
        navWiki.href = p.wiki;
        
        const ctrlContainer = document.getElementById('controls-display');
        ctrlContainer.innerHTML = p.controls.map(c => `
            <div class="control-item">
                <span class="btn-round ${c.class}">${c.btn}</span> ${c.label}
            </div>
        `).join('');
    }

    function loadEmulator(romUrl) {
        document.getElementById('game').innerHTML = '';
        window.EJS_player = "#game";
        window.EJS_core = "segaMD";
        window.EJS_gameUrl = romUrl;
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        
        const loader = document.createElement('script');
        loader.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        document.body.appendChild(loader);
    }

    selector.addEventListener('change', (e) => {
        const id = e.target.value;
        updateUI(id);
        loadEmulator(projects[id].rom);
    });

    // Initial Load
    updateUI('tetris');
    loadEmulator(projects['tetris'].rom);
</script>

</body>
</html>
